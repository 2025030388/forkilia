<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Forkilia - Iniciar sesión</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e8f0fb 0%, #fdf6e3 50%, #eaf5ea 100%);
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .logo {
            width: 100px;
            height: auto;
            margin: 0 auto 16px;
            display: block;
        }

        h1 {
            font-size: 26px;
            color: #1a2b4a;
            margin-bottom: 4px;
        }

        .subtitulo {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 32px;
        }

        label {
            display: block;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: #6b7280;
            margin-bottom: 6px;
            margin-top: 20px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 14px;
            background: #f3f4f6;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            box-shadow: 0 0 0 2px #7fb3d5;
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-eye {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #9ca3af;
            font-size: 14px;
            user-select: none;
        }

        button {
            width: 100%;
            margin-top: 28px;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: #5b8cc4;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #4a7aad;
        }

        button:disabled {
            background: #a9c1dc;
            cursor: not-allowed;
        }

        .mensaje-error {
            margin-top: 16px;
            color: #dc2626;
            font-size: 13px;
            min-height: 18px;
        }

        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="img/logo-forkilia.png.png" alt="Forkilia" class="logo">
        <h1>Forkilia</h1>
        <p class="subtitulo">Intelligent Kitchen Management</p>

        <form id="formLogin">
            <label>USUARIO</label>
            <input type="text" id="username" placeholder="Ingresa tu usuario" autocomplete="username" required>

            <label>CONTRASEÑA</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
                <span class="toggle-eye" onclick="togglePassword()">👁</span>
            </div>

            <button type="submit" id="btnIngresar">Ingresar</button>
            <p class="mensaje-error" id="mensajeError"></p>
        </form>

        <p class="footer">© 2026 Forkilia. Todos los derechos reservados.</p>
    </div>

    <script>
        function togglePassword() {
            const campo = document.getElementById('password');
            campo.type = campo.type === 'password' ? 'text' : 'password';
        }

        document.getElementById('formLogin').addEventListener('submit', async function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const boton = document.getElementById('btnIngresar');
            const mensajeError = document.getElementById('mensajeError');

            mensajeError.textContent = '';
            boton.disabled = true;
            boton.textContent = 'Ingresando...';

            try {
                const datos = new URLSearchParams();
                datos.append('username', username);
                datos.append('password', password);

                const respuesta = await fetch('http://localhost:8080/forkilia/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: datos
                });

                const data = await respuesta.json();

                if (data.exito) {
                    sessionStorage.setItem('forkilia_usuario', JSON.stringify(data));

                    if (data.rol === 'Admin') {
                        mensajeError.style.color = '#16a34a';
                        mensajeError.textContent = 'Bienvenido Admin. (Pantalla de administración pendiente de construir)';
                    } else {
                        mensajeError.style.color = '#16a34a';
                        mensajeError.textContent = 'Bienvenido ' + data.nombre + '. (Dashboard pendiente de construir)';
                    }
                } else {
                    mensajeError.style.color = '#dc2626';
                    mensajeError.textContent = data.mensaje || 'Usuario o contraseña incorrectos';
                }

            } catch (error) {
                mensajeError.style.color = '#dc2626';
                mensajeError.textContent = 'Error de conexión con el servidor';
                console.error(error);
            } finally {
                boton.disabled = false;
                boton.textContent = 'Ingresar';
            }
        });
    </script>

</body>
</html>
